# Settings for run.py.  Edit this file, then run:  python run.py
#
# This file runs the full method on the competition problem: several greedy
# solutions per sub-problem, a diverse choice of seeds, and 4 parallel
# processes.  That needs MPI (option A in README.md installs it).
#   - No MPI, or just checking the install?  Use config_quick.toml (one core).
#   - One core with this file: set  workers = 1  and  seeds = 1.
#
# Relative paths are relative to this file.  Keys you leave out fall back to
# run.py's built-in defaults (one core, one solution per sub-problem).  The
# keys in the step sections are the command-line options of that step's
# script (edge_spacing -> --edge-spacing).

# ---------------------------------------------------------------------------
# The problem: which buildings, which coverage thresholds, how many antennas.
# Every tau x k combination is solved as a separate sub-problem.
# ---------------------------------------------------------------------------
[problem]
geojson = "data/GIS-cup-competition-dataset.geojson"
tau = [0.32, 0.49, 0.68]
k = [9, 49, 484]
building_id_column = "id"

# ---------------------------------------------------------------------------
# How to run.
# ---------------------------------------------------------------------------
[run]
output_dir = "outputs"
# Number of parallel processes.  1 needs no MPI installation; more than 1
# needs MPI (e.g. OpenMPI) and the mpi4py package.  All steps use it; in step 4
# the processes are shared between the seeds (see [step4_annealing]).
# Every process loads its own copy of the visibility table: roughly 3 GB each
# for the competition data at edge_spacing = 20 (estimate), so 4 workers need
# about 12 GB of memory.  See "Parallel runs" in README.md.
workers = 4
random_seed = 42
mpi_launcher = "mpiexec"
mpi_args = []          # extra launcher options, e.g. ["--oversubscribe"]

# ---------------------------------------------------------------------------
# Step 1: candidate antenna points and their visible boundary segments.
# The result is cached and reused until the GeoJSON or these settings change.
# ---------------------------------------------------------------------------
[step1_visibility]
# Distance between candidate points along each building edge, in metres.
# Building corners are always candidates.  Smaller = more candidates = better
# solutions, but slower and more memory.  (The competition run used 5.)
edge_spacing = 20.0
# Use only the first N candidate points (0 = all).  Handy for quick tests.
max_points = 0

# ---------------------------------------------------------------------------
# Step 2: build first solutions for every (tau, k).
# ---------------------------------------------------------------------------
[step2_greedy]
# "two_step": greedy with a two-step lookahead (good for any k).
# "multistart": many greedy runs from different first antennas (only
#               practical for small k, e.g. k <= 20; needs workers >= 3 to
#               run in parallel).
# The method applies to every k above.  See "Step 2" in README.md.
method = "two_step"
# alpha: weight of the hard score (buildings reaching tau) against the soft
# score (partial progress towards tau); 1.0 = hard score only.
# lookahead_width (two_step): candidates kept at each lookahead step.  Each
# step costs about (1 + lookahead_width) evaluations of all candidates.
# Both may be one value or a list; every combination gives one solution per
# sub-problem, so 3 x 2 = 6 solutions here.  Step 2 time grows with the
# number of combinations; with workers > 1 the runs are shared between the
# processes.  The competition run used alpha = [0.4, 0.6, 0.8, 1.0] and
# lookahead_width = [1, 5, 10] (12 solutions, several times slower).
# One solution only:  alpha = 0.8  and  lookahead_width = 3.
alpha = [0.6, 0.8, 1.0]
lookahead_width = [1, 3]
# multistart: the starts are the best grid_top_k points of every grid cell,
# plus the best global_top_fraction of all candidates (0.01 = top 1%), plus
# random_count randomly chosen candidates.
grid_size_meters = 200.0
grid_top_k = 5
global_top_fraction = 0.0
random_count = 0

# ---------------------------------------------------------------------------
# Step 3: improve solutions by swapping one antenna at a time.
# ---------------------------------------------------------------------------
[step3_point_swap]
enabled = true
# How many of the best distinct step-2 solutions to improve (one after
# another), per sub-problem.  The limits below apply to each of them.
solutions = 4
beam_width = 1
max_generations = 10   # 0 = until no swap improves the solution
max_seconds = 120      # per solution; 0 = no time limit

# ---------------------------------------------------------------------------
# Step 4: simulated annealing.  It always keeps the best solution found, so a
# longer run can only help.
# ---------------------------------------------------------------------------
[step4_annealing]
enabled = true
max_seconds = 600      # per sub-problem
# Number of different starting solutions (seeds), chosen from the step-3
# results by score and building diversity (see "Several solutions and seed
# selection" in README.md).  The processes are shared equally:
#   temperatures per seed = workers / seeds
# so seeds must divide workers.  Here 4 / 2 = 2 temperatures (x0.5 and x2.0)
# for each seed; seeds = 1 would give one seed 4 temperatures.
seeds = 2
# Seeds are normally taken from solutions within this fraction of the best
# score (0.05 = 5%); the limit is relaxed if too few qualify.
seed_score_tolerance = 0.05

# Optional fine-tuning; see "Step 4" in README.md and
# step4_annealing/simulated_annealing.py --help.  Values shown are the defaults.
# [step4_annealing.advanced]
# One cooling cycle lasts cycle_iterations iterations, then the temperature is
# raised again; it is also raised after stagnation_iterations iterations
# without a new best.  For short max_seconds, lower both so a few cycles fit
# (the log line "FINISHED iteration=..." shows how many iterations ran).
# cycle_iterations = 20000
# stagnation_iterations = 20000
# Spread of the per-process temperature profiles (0.7 = x0.5 to x2.0).
# temperature_log_spread = 0.7
# Share of the three kinds of moves.
# one_swap_probability = 0.75
# two_swap_probability = 0.20
# ruin_probability = 0.05
